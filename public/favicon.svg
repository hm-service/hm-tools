<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="HM Tools">
    <defs>
        <linearGradient id="hm-tile" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#0ea5e9" />
            <stop offset="1" stop-color="#0369a1" />
        </linearGradient>
        <!-- 开口扳手的钳口：在整圆上开一条平行槽 -->
